# Odbijanie graczy od skrzynek
push:
  distance: 0.5     # w jakiej odleglosci od krawedzi skrzynki (w blokach) gracz jest odbijany
  power: 0.35       # sila odbicia (0.2 = lekko, 0.6 = mocno)
# Klikniecie skrzynki (prawy przycisk) - cooldown na gracza w tickach (20 = 1 s)
click-cooldown: 40
